name: AI Curated Insights
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      # Состояние «уже отправлено» между запусками
      - uses: actions/cache@v4
        with:
          path: state
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - run: npm start
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          # Пока false: только превью в логе. Включить: переменная репозитория PUBLISH_ENABLED=true
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          MAX_PER_RUN: '3'
